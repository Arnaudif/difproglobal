services:
  - type: web
    name: difproglobal
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: VITE_PI_SANDBOX
        value: "true"
      - key: SUPABASE_URL
        value: https://kiitjvxbtmnzwjvgrxll.supabase.co
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: PI_API_KEY
        sync: false
      - key: SESSION_SECRET
        generateValue: true
